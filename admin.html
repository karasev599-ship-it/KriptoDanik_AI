<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b0b10"><title>KriptoDanik AI — Admin</title><style>*{box-sizing:border-box}body{margin:0;background:#0b0b10;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",sans-serif}.wrap{max-width:1100px;margin:auto;padding:22px 16px 50px}.head{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:20px}.brand{font-size:22px;font-weight:900}.muted{color:#9696a3}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.stat,.panel{background:#17171d;border:1px solid #292932;border-radius:18px;padding:18px}.stat b{display:block;font-size:30px;margin-top:7px}.tabs{display:flex;gap:8px;margin:18px 0}.tab,button{border:1px solid #34343e;background:#22222a;color:#fff;border-radius:12px;padding:10px 13px}.tab.active{background:#7c3aed;border-color:#7c3aed}.search{width:100%;padding:13px;border-radius:12px;border:1px solid #34343e;background:#111117;color:#fff;margin-bottom:12px}.table{overflow:auto}table{width:100%;border-collapse:collapse;min-width:760px}th,td{text-align:left;padding:12px;border-bottom:1px solid #292932;font-size:13px}th{color:#9696a3}.badge{display:inline-block;padding:5px 8px;border-radius:999px;font-size:11px;font-weight:800}.free{background:#27272f;color:#c4c4ce}.pro{background:#3b2b05;color:#fbbf24}.blocked{background:#4a171c;color:#fb7185}.actions{display:flex;gap:6px;flex-wrap:wrap}.danger{border-color:#6b2027;color:#fb7185}.hidden{display:none}@media(max-width:700px){.grid{grid-template-columns:repeat(2,1fr)}.head{align-items:flex-start;flex-direction:column}}
</style></head><body><div class="wrap"><div class="head"><div><div class="brand">👑 KriptoDanik AI — Owner</div><div class="muted">Центр управления проектом</div></div><button onclick="location.href='/'">← На сайт</button></div><div id="error" class="panel hidden"></div><div class="grid"><div class="stat">Пользователей<b id="total">—</b></div><div class="stat">FREE<b id="free">—</b></div><div class="stat">PRO<b id="pro">—</b></div><div class="stat">Активны сегодня<b id="active">—</b></div></div><div class="tabs"><button class="tab active" data-filter="all">Все</button><button class="tab" data-filter="free">FREE</button><button class="tab" data-filter="pro">PRO</button><button class="tab" data-filter="blocked">Заблокированные</button></div><div class="panel"><input id="search" class="search" placeholder="Поиск по имени, username или email"><div class="table"><table><thead><tr><th>Пользователь</th><th>Email</th><th>План</th><th>PRO до</th><th>Регистрация</th><th>Последний вход</th><th>Действия</th></tr></thead><tbody id="rows"></tbody></table></div></div></div><script>let users=[],filter='all';const $=id=>document.getElementById(id);function esc(v){return String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}function fmt(v){return v?new Date(v).toLocaleDateString('ru-RU'):'—'}async function api(action,opts={}){const r=await fetch('/api/admin?action='+action,{credentials:'same-origin',...opts,headers:{'Content-Type':'application/json',...(opts.headers||{})}});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'Ошибка');return d}async function load(){try{const [s,u]=await Promise.all([api('stats'),api('users')]);$('total').textContent=s.total;$('free').textContent=s.free;$('pro').textContent=s.pro;$('active').textContent=s.activeToday;users=u.users;render()}catch(e){$('error').textContent=e.message;$('error').classList.remove('hidden')}}function render(){const q=$('search').value.toLowerCase();const list=users.filter(u=>(filter==='all'||(filter==='free'&&u.plan!=='pro')||(filter==='pro'&&u.plan==='pro')||(filter==='blocked'&&u.blocked))&&(!q||[u.name,u.username,u.email].join(' ').toLowerCase().includes(q)));$('rows').innerHTML=list.map(u=>`<tr><td><b>${esc(u.name||u.username||'—')}</b><br><span class="muted">@${esc(u.username||'—')}</span></td><td>${esc(u.email)}</td><td><span class="badge ${u.plan==='pro'?'pro':'free'}">${u.plan==='pro'?'PRO':'FREE'}</span>${u.blocked?' <span class="badge blocked">BLOCKED</span>':''}</td><td>${fmt(u.pro_until)}</td><td>${fmt(u.created_at)}</td><td>${fmt(u.last_seen_at)}</td><td><div class="actions">${u.plan==='pro'?`<button onclick="setPlan('${u.id}','free')">FREE</button>`:`<button onclick="setPlan('${u.id}','pro')">Дать PRO</button>`}<button class="danger" onclick="toggleBlock('${u.id}',${!u.blocked})">${u.blocked?'Разблокировать':'Заблокировать'}</button></div></td></tr>`).join('')||'<tr><td colspan="7" class="muted">Пользователей не найдено</td></tr>'}async function setPlan(id,plan){try{await api('user',{method:'PATCH',body:JSON.stringify({id,plan,pro_until:plan==='pro'?new Date(Date.now()+30*864e5).toISOString():null})});await load()}catch(e){alert(e.message)}}async function toggleBlock(id,blocked){try{await api('user',{method:'PATCH',body:JSON.stringify({id,blocked})});await load()}catch(e){alert(e.message)}}document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));b.classList.add('active');filter=b.dataset.filter;render()});$('search').oninput=render;load();</script></body></html>

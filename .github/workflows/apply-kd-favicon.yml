name: Apply KD Intelligence favicon

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  favicon:
    if: ${{ !contains(github.event.head_commit.message, 'chore: apply KD Intelligence favicon') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update favicon references
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          index = Path('index.html')
          text = index.read_text(encoding='utf-8')
          text = text.replace('assets/favicon.png?v=1', 'assets/favicon.svg?v=2')
          index.write_text(text, encoding='utf-8')

          manifest = Path('manifest.webmanifest')
          m = manifest.read_text(encoding='utf-8')
          m = m.replace('assets/logo-brand.png', 'assets/favicon.svg')
          manifest.write_text(m, encoding='utf-8')
          PY

      - name: Commit and push
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html manifest.webmanifest
          if git diff --cached --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git commit -m "chore: apply KD Intelligence favicon"
          git push

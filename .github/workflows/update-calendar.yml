name: Update economic calendar

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
  push:
    paths:
      - 'scripts/update-calendar.py'
      - '.github/workflows/update-calendar.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Update calendar cache
        run: python3 scripts/update-calendar.py
      - name: Commit calendar cache
        run: |
          git config user.name 'KriptoDanik AI Calendar Bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/calendar.json
          git diff --cached --quiet && exit 0
          git commit -m 'chore: update economic calendar'
          git push

name: Update economic calendar

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
  push:
    paths:
      - 'scripts/update-calendar.py'
      - '.github/workflows/update-calendar.yml'

permissions:
  contents: write

concurrency:
  group: economic-calendar
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Update calendar cache
        run: python3 scripts/update-calendar.py

      - name: Commit calendar cache
        run: |
          git config user.name 'KriptoDanik AI Calendar Bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/calendar.json

          if git diff --cached --quiet; then
            echo 'Calendar cache is already up to date.'
            exit 0
          fi

          git commit -m 'chore: update economic calendar'
          git pull --rebase origin main
          git push origin HEAD:main
